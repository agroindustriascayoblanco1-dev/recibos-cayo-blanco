<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Recibos</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<div class="contenedor">


<h1>AGROINDUSTRIAS</h1>

<h1>CAYO BLANCO</h1>

<p class="subtitulo">

<strong>CONSULTA TU RECIBO DE PAGO</strong>

</p>

<div class="campo">

<label>

Ingresa tu código de empleado

</label>

<input
type="text"
id="codigo"
placeholder="Ejemplo: CBEP0000"
autocomplete="off">

</div>

<button id="buscar">

Buscar Recibo

</button>

<div id="mensaje"></div>

<canvas id="visorPDF"></canvas>

<button id="descargar">

📥 Guardar Recibo

</button>

<p class="pie">

<em>⚠️ No compartas tu recibo de pago. La información que contiene es confidencial y de uso personal.</em>

</p>

</div>

<script src="script.js"></script>

</body>

</html>
